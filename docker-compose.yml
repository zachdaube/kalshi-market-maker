version: '3.8'

services:
  market-maker:
    build: .
    container_name: kalshi-market-maker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - KALSHI_KEY_ID=${KALSHI_KEY_ID}
    volumes:
      # Mount your private key file
      - ./kalshidemo.txt:/app/kalshidemo.txt:ro
      - ./kalshiprod.txt:/app/kalshiprod.txt:ro
      # Mount config for easy editing
      - ./config:/app/config:ro
    # For dashboard with trading (has SDK compatibility issues):
    # command: python dashboard.py --env prod --live --yes --port 8080
    # For standalone trading worker (recommended - more reliable):
    command: python trading_worker.py --env prod --live
