# Kalshi Market Maker - Demo Configuration
# Uses virtual money on demo API for safe testing

environment: demo

execution:
  quote_interval: 1.0           # Seconds between quote updates
  position_sync_interval: 5.0   # Seconds between position syncs
  total_max_position: 500       # Max total exposure (contracts)
  cancel_threshold: 1           # Requote if price moves this much
  dry_run: true                 # Set to false for real orders on demo

# Markets to trade - update with current active market tickers
# Find markets at: https://demo.kalshi.co/markets (demo) or https://kalshi.com/markets (prod)
markets:
  - ticker: REPLACE_WITH_DEMO_MARKET_TICKER
    enabled: true
    # Avellaneda-Stoikov parameters
    gamma: 0.1      # Risk aversion (higher = wider spreads)
    sigma: 2.0      # Volatility estimate (cents)
    k: 1.5          # Order arrival decay parameter
    base_size: 10   # Contracts per order
    max_position: 100
    max_loss_cents: 500.0

api:
  key_id: ${KALSHI_KEY_ID}
  private_key_file: kalshidemo.txt
  host: https://demo-api.kalshi.co/trade-api/v2
